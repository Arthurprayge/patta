<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- uma patinha: almofada + 4 dedos -->
    <g id="pata" fill="#dcc7a4">
      <ellipse cx="0"   cy="12"  rx="15" ry="12"/>
      <ellipse cx="-19" cy="-3"  rx="6"  ry="9" transform="rotate(-22 -19 -3)"/>
      <ellipse cx="-7"  cy="-14" rx="6"  ry="9"/>
      <ellipse cx="7"   cy="-14" rx="6"  ry="9"/>
      <ellipse cx="19"  cy="-3"  rx="6"  ry="9" transform="rotate(22 19 -3)"/>
    </g>
  </defs>

  <use href="#pata" x="60"  y="60"  transform="rotate(-12 60 60)"/>
  <use href="#pata" x="250" y="40"  transform="rotate(-8 250 40)"/>
  <use href="#pata" x="340" y="180" transform="rotate(10 340 180)"/>
  <use href="#pata" x="150" y="200" transform="rotate(12 150 200)"/>
  <use href="#pata" x="50"  y="310" transform="rotate(-10 50 310)"/>
  <use href="#pata" x="260" y="340" transform="rotate(8 260 340)"/>
</svg>
