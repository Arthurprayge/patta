<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Tai Vet Pet Hotel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <img class="logo" src="img/logoTaiVet.svg" alt="Tai Vet Pet Hotel">

    <form id="form-entrar" novalidate>
      <h1>ENTRAR</h1>
      <p class="subtitulo">Acesse sua conta para gerenciar seus pets e agendamentos.</p>

      <div class="campo">
        <label for="email">Email</label>
        <div class="entrada">
          <i class="fa-regular fa-envelope"></i>
          <input id="email" type="email" placeholder="seuemail@gmail.com">
        </div>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="entrada">
          <i class="fa-solid fa-lock"></i>
          <input id="senha" type="password" placeholder="************************">
          <button type="button" class="olho"><i class="fa-regular fa-eye"></i></button>
        </div>
      </div>

      <div class="opcoes">
        <label class="lembrar"><input type="checkbox"> Lembrar de mim</label>
        <a href="#">Esqueci minha senha</a>
      </div>

      <button class="botao" type="submit">Entrar</button>
      <p class="troca"><a href="criar-conta.html">Não tem uma conta? Cadastre-se</a></p>
    </form>
  </main>

  <footer></footer>
  <script src="script.js"></script>
</body>
</html>
